  <script>
    (function() {
      var iv = null;
      function runPreloaderSequence() {
        var pre = document.getElementById('mk-preloader');
        var bar = document.getElementById('mk-loader-bar');
        var scenes = pre ? pre.querySelectorAll('.mk-scene-item') : [];
        var dots = pre ? pre.querySelectorAll('.mk-scene-dot') : [];
        if (!pre) return;
        pre.classList.remove('mk-hidden');
        if (iv) clearInterval(iv);
        var p = 0;
        var lastIdx = -1;
        iv = setInterval(function() {
          p += 3;
          if (p >= 100) {
            p = 100;
            clearInterval(iv);
            setTimeout(function() {
              pre.classList.add('mk-hidden');
            }, 260);
          }
          if (bar) bar.style.width = p + '%';
          var idx = Math.min(5, Math.floor((p / 100) * 6));
          if (idx !== lastIdx) {
            lastIdx = idx;
            for (var i = 0; i < scenes.length; i++) {
              scenes[i].classList.toggle('active', i === idx);
              if (dots[i]) dots[i].classList.toggle('active', i === idx);
            }
          }
        }, 70);
      }
      window.replayWellpackPreloader = runPreloaderSequence;
      runPreloaderSequence();
    })();
  </script>
