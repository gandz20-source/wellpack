<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>WellPack Cárnico | Maquinaria y Líneas para Rubro Cárnico & Cecinas</title>
  <meta name="description" content="División Maquinaria Industrial para el Rubro Cárnico, Frigoríficos y Fábricas de Cecinas. Desmenuzadoras de congelados, picadoras pesadas, cutters al vacío, embutidoras y hornos ahumadores en acero SUS304.">
  
  <!-- Favicon Oficial WellPack WP -->
  <link rel="icon" type="image/png" href="/assets/images/logo_wp_badge.png">
  <link rel="apple-touch-icon" href="/assets/images/logo_wp_badge.png">

  <!-- Tipografía Industrial Moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            heading: ['Space Grotesk', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- GSAP y ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #120606;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #120606;
    }
    ::-webkit-scrollbar-thumb {
      background: #dc2626;
      border-radius: 4px;
      border: 1px solid #f87171;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ef4444;
    }

    @keyframes heroPanLeftRight {
      0% {
        transform: translate3d(-5.5%, 0, 0) scale(1.06);
      }
      50% {
        transform: translate3d(5.5%, -1.8%, 0) scale(1.09);
      }
      100% {
        transform: translate3d(-5.5%, 0, 0) scale(1.06);
      }
    }

    .animate-hero-pan {
      animation: heroPanLeftRight 9s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      will-change: transform;
    }

    .spotlight-card {
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .spotlight-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(550px circle at var(--mouse-x, -999px) var(--mouse-y, -999px), rgba(220, 38, 38, 0.16), transparent 42%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }
    .spotlight-card:hover::before {
      opacity: 1;
    }

    .btn-spring {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-spring:hover {
      transform: translateY(-2px) scale(1.02);
    }
    .btn-spring:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body data-page-mode="meat_machinery" class="min-h-screen bg-[#120606] text-white selection:bg-red-500 selection:text-white font-sans">

  <div id="app" class="relative bg-[#120606] text-white min-h-screen">
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
      <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-mono text-xs text-red-400 tracking-widest uppercase animate-pulse font-bold">
        Cargando División Maquinaria Cárnica...
      </p>
    </div>
  </div>

  <script type="module" src="js/antigravity-renderer.js?v=multi_divisions_v25"></script>

</body>
</html>
