  <script>
    (function() {
      var iv = null;
      function runPreloaderSequence() {
        var pre = document.getElementById('mk-preloader');
        var bar = document.getElementById('mk-loader-bar');
        var pct = document.getElementById('mk-loader-pct');
        var st = document.getElementById('mk-loader-status');
        var s1 = document.getElementById('mk-st-1');
        var s2 = document.getElementById('mk-st-2');
        var s3 = document.getElementById('mk-st-3');
        var s4 = document.getElementById('mk-st-4');
        if (!pre) return;
        pre.classList.remove('mk-hidden');
        if (iv) clearInterval(iv);
        var p = 8;
        iv = setInterval(function() {
          p += 4;
          if (p >= 100) {
            p = 100;
            clearInterval(iv);
            setTimeout(function() {
              pre.classList.add('mk-hidden');
            }, 320);
          }
          if (bar) bar.style.width = p + '%';
          if (pct) pct.textContent = p + '%';
          if (s1) s1.classList.toggle('active', p >= 5);
          if (s2) s2.classList.toggle('active', p >= 30);
          if (s3) s3.classList.toggle('active', p >= 58);
          if (s4) s4.classList.toggle('active', p >= 82);
          if (st) {
            if (p < 30) st.textContent = 'Etapa 01/04 · Inicializando Línea de Fileteado y Despielado...';
            else if (p < 58) st.textContent = 'Etapa 02/04 · Sincronizando Control SCADA y Videoteca...';
            else if (p < 82) st.textContent = 'Etapa 03/04 · Cargando 12 Equipos Pesqueros + Videos...';
            else st.textContent = 'Etapa 04/04 · Planta Proceso Pesquero AISI 316L Lista';
          }
        }, 85);
      }
      window.replayWellpackPreloader = runPreloaderSequence;
      runPreloaderSequence();
    })();
  </script>
