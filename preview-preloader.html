<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preloader IndustrialWellPack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #15141C;
      background-image:
        radial-gradient(circle at 50% 45%, rgba(255, 118, 24, 0.08), transparent 55%),
        linear-gradient(rgba(255, 255, 255, 0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.016) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    svg, svg * {
      shape-rendering: geometricPrecision;
    }

    .loader-center-box {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .scene-stage {
       position: relative;
      width: 320px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mk-scene-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.92) translateY(8px);
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .mk-scene-item.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Barra de carga minimalista sin texto */
    .bar-track {
      width: 220px;
      height: 6px;
      background: #232232;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid #323146;
    }

    .bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #FF7618, #F6AF24);
      border-radius: 99px;
      transition: width 0.08s linear;
    }

    /* Puntos indicadores de las 6 escenas (sin letras) */
    .dots-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .scene-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2E2D40;
      transition: all 0.22s ease;
      cursor: pointer;
    }

    .scene-dot.active {
      background: #FF7618;
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(255, 118, 24, 0.7);
    }

    /* =====================================================================
       ANIMACIONES MECÁNICAS DE LAS 6 ESCENAS
       ===================================================================== */
    /* Escena 1: Brazo Robótico */
    @keyframes mkArmUpper {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes mkArmFore {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes mkArmWrist {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }
    @keyframes mkClawL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes mkClawR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes mkBeltBoxes {
      0% { transform: translateX(0px); }
      100% { transform: translateX(42px); }
    }

    .s1-upper { transform-origin: 72px 109px; animation: mkArmUpper 1.1s ease-in-out infinite; }
    .s1-fore  { transform-origin: 152px 58px; animation: mkArmFore 1.1s ease-in-out infinite; }
    .s1-wrist { transform-origin: 196px 85px; animation: mkArmWrist 1.1s ease-in-out infinite; }
    .s1-claw-l { transform-origin: 185px 105px; animation: mkClawL 1.1s ease-in-out infinite; }
    .s1-claw-r { transform-origin: 207px 105px; animation: mkClawR 1.1s ease-in-out infinite; }
    .s-boxes  { animation: mkBeltBoxes 0.75s linear infinite; }

    /* Escena 2: Operador Empaque */
    @keyframes mkWorkerPack {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    .s2-worker { animation: mkWorkerPack 0.8s ease-in-out infinite; }

    /* Escena 3: Sala de Control SCADA */
    @keyframes mkLever {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes mkBeacon {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #EB5E28); }
      50% { opacity: 0.35; filter: none; }
    }
    .s3-lever { transform-origin: 96px 168px; animation: mkLever 0.9s ease-in-out infinite; }
    .s3-beacon { animation: mkBeacon 0.55s ease-in-out infinite; }

    /* Escena 4: Pinza Pick & Place */
    @keyframes mkPickerMove {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-12px, 12px) rotate(-5deg); }
    }
    .s4-picker { transform-origin: 240px 70px; animation: mkPickerMove 0.9s ease-in-out infinite; }

    /* Escena 5: Cinta Inclinada */
    @keyframes mkInclinedBoxes {
      0% { transform: translateX(0px); }
      100% { transform: translateX(38px); }
    }
    @keyframes mkReceiverHands {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      50% { transform: rotate(-4deg) translateY(3px); }
    }
    .s5-boxes { animation: mkInclinedBoxes 0.75s linear infinite; }
    .s5-worker { transform-origin: 245px 135px; animation: mkReceiverHands 0.85s ease-in-out infinite; }

    /* Escena 6: Montacargas Industrial */
    @keyframes mkForkLiftUp {
      0%, 100% { transform: translateY(4px); }
      50% { transform: translateY(-22px); }
    }
    @keyframes mkForkCab {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .s6-lift { animation: mkForkLiftUp 1s ease-in-out infinite; }
    .s6-cab  { animation: mkForkCab 0.45s ease-in-out infinite; }
  </style>
</head>

  <script>
    var currentIdx = 0;
    var progress = 0;
    var scenes = document.querySelectorAll('.mk-scene-item');
    var dots = document.querySelectorAll('.scene-dot');
    var bar = document.getElementById('bar-fill');

    function showScene(idx) {
      currentIdx = idx;
      for (var i = 0; i < scenes.length; i++) {
        scenes[i].classList.toggle('active', i === idx);
        dots[i].classList.toggle('active', i === idx);
      }
    }

    setInterval(function() {
      progress += 2;
      if (progress > 100) progress = 0;
      if (bar) bar.style.width = progress + '%';
      var idx = Math.min(5, Math.floor((progress / 100) * 6));
      if (idx !== currentIdx) {
        showScene(idx);
      }
    }, 65);
  </script>
